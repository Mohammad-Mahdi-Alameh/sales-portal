<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-lg font-semibold text-slate-900">Organizations</h1>
      <p class="text-sm text-slate-500">Manage client organizations</p>
    </div>
    <a
      routerLink="/organizations/new"
      class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700"
    >
      New organization
    </a>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    [pagination]="pagination()"
    [searchTerm]="search()"
    [sort]="sort()"
    searchPlaceholder="Search organizations…"
    emptyTitle="No organizations"
    emptyMessage="Create your first organization to get started."
    emptyActionLabel="New organization"
    (searchChange)="onSearch($event)"
    (sortChange)="onSort($event)"
    (pageChange)="load($event)"
    (retry)="load()"
    (emptyAction)="goNew()"
  >
    <ng-template #appRow let-org>
      <td class="px-4 py-3">
        <a [routerLink]="['/organizations', org.id]" class="font-medium text-indigo-600 hover:underline">
          {{ org.name }}
        </a>
        <p class="text-xs text-slate-400">{{ org.country }}</p>
      </td>
      <td class="px-4 py-3 text-slate-600">{{ org.adminName || '—' }}</td>
      <td class="px-4 py-3 text-center text-slate-600">{{ org.branchCount ?? 0 }}</td>
      <td class="px-4 py-3 text-center text-slate-600">{{ org.venueCount ?? 0 }}</td>
      <td class="px-4 py-3">
        <span
          class="inline-flex rounded-full px-2 py-0.5 text-xs font-medium"
          [class.bg-emerald-100]="org.isActive"
          [class.text-emerald-700]="org.isActive"
          [class.bg-slate-100]="!org.isActive"
          [class.text-slate-500]="!org.isActive"
        >
          {{ org.isActive ? 'Active' : 'Inactive' }}
        </span>
      </td>
      <td class="px-4 py-3 text-right">
        <button
          type="button"
          class="rounded-md border border-slate-300 px-2.5 py-1 text-xs font-medium text-slate-700 hover:bg-slate-50"
          (click)="toggleActive(org)"
        >
          {{ org.isActive ? 'Deactivate' : 'Activate' }}
        </button>
      </td>
    </ng-template>
  </app-data-table>
</div>
