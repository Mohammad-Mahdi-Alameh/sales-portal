<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-lg font-semibold text-slate-900">Venues</h1>
      <p class="text-sm text-slate-500">All venues across organizations and standalone</p>
    </div>
    <a
      routerLink="/venues/new"
      class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700"
    >
      New venue
    </a>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    [pagination]="pagination()"
    [searchTerm]="search()"
    [sort]="sort()"
    searchPlaceholder="Search venues…"
    emptyTitle="No venues"
    emptyMessage="Create a venue or adjust the filters."
    emptyActionLabel="New venue"
    (searchChange)="onSearch($event)"
    (sortChange)="onSort($event)"
    (pageChange)="load($event)"
    (retry)="load()"
    (emptyAction)="goNew()"
  >
    <div tableActions class="flex gap-2">
      <select
        class="rounded-md border border-slate-300 bg-white px-2.5 py-1.5 text-sm text-slate-700 focus:border-indigo-500 focus:outline-none"
        aria-label="Filter by organization"
        (change)="onOrgFilter($any($event.target).value)"
      >
        <option value="">All organizations</option>
        @for (o of organizations(); track o.id) {
          <option [value]="o.id">{{ o.name }}</option>
        }
      </select>
      <select
        class="rounded-md border border-slate-300 bg-white px-2.5 py-1.5 text-sm text-slate-700 focus:border-indigo-500 focus:outline-none"
        aria-label="Filter by type"
        (change)="onTypeFilter($any($event.target).value)"
      >
        <option value="">All types</option>
        <option value="organization">Under organization</option>
        <option value="standalone">Standalone</option>
      </select>
      <select
        class="rounded-md border border-slate-300 bg-white px-2.5 py-1.5 text-sm text-slate-700 focus:border-indigo-500 focus:outline-none"
        aria-label="Filter by status"
        (change)="onStatusFilter($any($event.target).value)"
      >
        <option value="">All statuses</option>
        @for (s of statuses; track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </div>

    <ng-template #appRow let-venue>
      <td class="px-4 py-3">
        <a [routerLink]="['/venues', venue.id]" class="font-medium text-indigo-600 hover:underline">
          {{ venue.name }}
        </a>
      </td>
      <td class="px-4 py-3 text-slate-600">{{ venue.ownerName || '—' }}</td>
      <td class="px-4 py-3 text-slate-600">{{ venue.orgName || 'Standalone' }}</td>
      <td class="px-4 py-3 text-slate-600 capitalize">{{ venue.type }}</td>
      <td class="px-4 py-3">
        <span
          class="inline-flex rounded-full px-2 py-0.5 text-xs font-medium"
          [class.bg-emerald-100]="venue.status === 'Active'"
          [class.text-emerald-700]="venue.status === 'Active'"
          [class.bg-amber-100]="venue.status === 'Trial'"
          [class.text-amber-700]="venue.status === 'Trial'"
          [class.bg-slate-100]="venue.status === 'Inactive'"
          [class.text-slate-500]="venue.status === 'Inactive'"
        >
          {{ venue.status }}
        </span>
      </td>
      <td class="px-4 py-3 text-right">
        <select
          class="rounded-md border border-slate-300 bg-white px-2 py-1 text-xs text-slate-700 focus:border-indigo-500 focus:outline-none"
          aria-label="Change status"
          [value]="venue.status"
          (change)="changeStatus(venue, $any($event.target).value)"
        >
          @for (s of statuses; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </td>
    </ng-template>
  </app-data-table>
</div>
